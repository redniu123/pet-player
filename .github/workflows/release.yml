name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create build report
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath dist -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE was not produced' }
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $report = [ordered]@{
            schemaVersion = 1
            version = $package.version
            executable = $exe.Name
            executableSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
            electron = $package.devDependencies.electron
            signed = $false
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $report | ConvertTo-Json | Set-Content -Encoding utf8NoBOM -LiteralPath 'dist/build-report.json'
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -LiteralPath dist -Filter '*.exe' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $exe.FullName 'dist/build-report.json' --generate-notes --verify-tag --notes "Unsigned Windows portable build. Verify the SHA-256 value in build-report.json before running."
